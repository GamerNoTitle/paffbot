<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5060B0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title></title>
    <link rel="stylesheet" href="./styles.css?v=59" />
    <script src="./vendor/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="page">
      <div class="page-top">
        <div class="page-top__left">
          <img class="logo" src="./icon-192.png" alt="" width="40" height="40" data-i18n-alt="app.name" />
          <div class="segmented" role="tablist" data-i18n-aria="nav.aria" aria-label="" id="nav">
          <button type="button" role="tab" data-view="verify" aria-selected="true" data-i18n="nav.verify"></button>
            <button type="button" role="tab" data-view="audit" aria-selected="false" data-i18n="nav.audit"></button>
            <button type="button" role="tab" data-view="settings" aria-selected="false" data-i18n="nav.settings" class="hidden"></button>
          </div>
        </div>
        <md-icon-button id="theme-toggle" data-i18n-aria="nav.theme" aria-label="">
          <md-icon id="theme-icon"></md-icon>
        </md-icon-button>
      </div>

      <section id="view-verify" class="view">
        <div class="hero" id="hero">
          <div class="hero__copy">
            <p class="hero__eyebrow" id="hero-eyebrow" data-i18n="app.name"></p>
            <h1 class="hero__title" id="hero-title" data-i18n="hero.checking"></h1>
            <p class="hero__sub" id="hero-sub" data-i18n="hero.checkingSub"></p>
            <div class="hero__chips" id="hero-chips"></div>
            <div class="hero__progress hidden" id="hero-progress" role="progressbar" data-i18n-aria="hero.progressAria" aria-label="">
              <div class="wavy">
                <svg class="wavy__svg" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true">
                  <path class="wavy__track" id="wavy-track" d="" />
                </svg>
                <div class="wavy__mask" id="wavy-mask">
                  <svg class="wavy__svg" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true">
                    <path class="wavy__bar" id="wavy-bar" d="" />
                  </svg>
                </div>
              </div>
            </div>
          </div>
          <div class="hero__art" id="hero-art" aria-hidden="true"></div>
        </div>

        <div class="state" id="state-loading">
          <md-circular-progress indeterminate></md-circular-progress>
        </div>

        <div class="state hidden" id="state-empty">
          <div class="state__icon"><md-icon id="empty-icon"></md-icon></div>
          <h2 class="md-typescale-headline-small" id="empty-title" data-i18n="empty.title"></h2>
          <p class="md-typescale-body-medium muted" id="empty-text">
            <span data-i18n="empty.text"></span>
          </p>
          <div class="bound hidden" id="bound"></div>
          <div class="actions">
            <md-filled-tonal-button id="refresh" data-i18n="empty.refresh"></md-filled-tonal-button>
          </div>
        </div>

        <div id="pending" class="hidden">
          <div class="panel" id="method-panel"></div>
        </div>
      </section>

      <section id="view-settings" class="view hidden">
        <div class="panel" id="settings-panel">
          <div class="panel__head">
            <h2 class="md-typescale-headline-medium" data-i18n="settings.title"></h2>
            <p class="md-typescale-body-medium muted" data-i18n="settings.desc"></p>
          </div>
          <div id="settings-form"></div>
          <div class="settings__actions">
            <md-filled-button id="settings-save" disabled data-i18n="settings.save"></md-filled-button>
            <span id="settings-hint" class="md-typescale-body-small muted"></span>
          </div>
        </div>
      </section>

      <section id="view-audit" class="view hidden">
        <header class="page-head">
          <h1 class="md-typescale-headline-large" data-i18n="audit.title"></h1>
          <p class="md-typescale-body-medium muted" data-i18n="audit.sub"></p>
        </header>

        <div class="card hidden" id="token-card">
          <md-outlined-text-field id="admin-token" data-i18n-label="audit.tokenLabel" label="" type="password"></md-outlined-text-field>
          <div class="filter-actions">
            <md-filled-button id="btn-token" data-i18n="audit.saveToken"></md-filled-button>
          </div>
        </div>

        <div class="card">
          <div class="filter-row">
            <div class="dd">
            <button type="button" class="dd__btn" id="audit-group" data-i18n-aria="audit.groupAll" aria-label="" aria-haspopup="listbox" aria-expanded="false"><span class="dd__label"></span></button>
            <div class="dd__menu" role="listbox" hidden></div>
          </div>
            <div class="filter-actions">
              <md-outlined-button id="btn-audit-csv" data-i18n="audit.export"></md-outlined-button>
            </div>
          </div>
          <p class="md-typescale-body-small muted" id="audit-hint"></p>
        </div>

        <div id="audit-stats"></div>
        <div id="audit-body"></div>
      </section>

      <footer class="foot md-typescale-label-medium">
        <div class="dd dd--sm">
          <button type="button" class="dd__btn" id="lang" aria-label="Language" aria-haspopup="listbox" aria-expanded="false"><span class="dd__label"></span></button>
          <div class="dd__menu" role="listbox" hidden></div>
        </div>
        <span id="foot"></span>
      </footer>
    </div>

    <md-dialog id="success-dialog" type="alert">
      <div slot="headline" class="md-typescale-headline-small" id="dialog-title" data-i18n="dialog.approved.title"></div>
      <div slot="content" class="dialog-body">
        <div class="dialog-icon" id="dialog-icon-wrap"><md-icon id="dialog-icon"></md-icon></div>
        <p class="md-typescale-body-medium" id="dialog-text"></p>
      </div>
      <div slot="actions">
        <md-filled-button id="dialog-close" data-i18n="dialog.closeDone"></md-filled-button>
      </div>
    </md-dialog>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./app.js?v=93"></script>
  </body>
</html>
