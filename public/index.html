<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>paffbot · 入群验证</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div class="brand">
          <div class="mark">P</div>
          <div>
            <div class="name">paffbot</div>
            <div class="sub" id="whoami">入群验证</div>
          </div>
        </div>
        <nav class="tabs" role="tablist">
          <button class="tab active" data-tab="verify" role="tab">验证</button>
          <button class="tab" data-tab="audit" role="tab">审计</button>
        </nav>
      </header>

      <section id="view-verify" class="view">
        <div class="card center muted" id="loading">加载中…</div>

        <div class="card center hidden" id="empty">
          <h2>暂无待验证的申请</h2>
          <p class="help">在群里点击「申请加入」后，我会私聊你一个验证入口。</p>
          <button class="ghost" id="refresh">刷新</button>
        </div>

        <div id="pending" class="hidden">
          <div class="card meta-card">
            <div class="meta-row">
              <span class="label">目标群</span>
              <strong id="chat-title">—</strong>
            </div>
            <div class="meta-row">
              <span class="label">剩余时间</span>
              <strong id="countdown" class="mono">—</strong>
            </div>
          </div>

          <div class="chips" id="method-chips"></div>
          <div class="card" id="method-panel"></div>
        </div>

        <div class="card center hidden" id="success">
          <div class="success-icon">✓</div>
          <h2>验证通过</h2>
          <p class="help" id="success-text"></p>
          <button class="primary" id="close">关闭</button>
        </div>
      </section>

      <section id="view-audit" class="view hidden">
        <div class="card hidden" id="token-card">
          <label class="field">
            <span>浏览器模式：填入 ADMIN_TOKEN</span>
            <input id="admin-token" type="password" placeholder="仅部署者知道" autocomplete="off" />
          </label>
          <button class="primary" id="btn-token">保存并使用</button>
        </div>

        <div class="card">
          <label class="field">
            <span>群组 ID</span>
            <input id="audit-chat" inputmode="numeric" placeholder="例如 -1001234567890" />
          </label>
          <div class="row gap">
            <button class="primary" id="btn-audit-load">查询</button>
            <button class="ghost" id="btn-audit-csv">导出 CSV</button>
          </div>
          <p class="help" id="audit-hint"></p>
        </div>

        <div id="audit-body"></div>
      </section>

      <footer class="foot">paffbot · Cloudflare Workers + D1</footer>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
