<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4F5BD5" />
    <title>paffbot · 入群验证</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./vendor/telegram-web-app.js"></script>
  </head>
  <body>
    <header class="app-bar">
      <div class="app-bar__brand">
        <span class="brand-mark">P</span>
        <span class="md-typescale-title-medium">paffbot</span>
      </div>
      <md-icon-button id="theme-toggle" aria-label="切换明暗主题">
        <md-icon id="theme-icon"></md-icon>
      </md-icon-button>
    </header>

    <main class="page">
      <md-tabs aria-label="页面" class="tabs">
        <md-primary-tab id="tab-verify" active>
          <md-icon slot="icon" id="tab-verify-icon"></md-icon>
          验证
        </md-primary-tab>
        <md-primary-tab id="tab-audit">
          <md-icon slot="icon" id="tab-audit-icon"></md-icon>
          审计
        </md-primary-tab>
      </md-tabs>

      <section id="view-verify" class="view">
        <div class="hero" id="hero">
          <p class="md-typescale-label-large hero__eyebrow" id="hero-eyebrow">PAFFBOT · 入群验证</p>
          <h1 class="md-typescale-display-small hero__title" id="hero-title">正在检查…</h1>
          <p class="md-typescale-body-large hero__sub" id="hero-sub">稍等，正在读取你的验证状态</p>
          <div class="hero__chips" id="hero-chips"></div>
        </div>

        <div class="state" id="state-loading">
          <md-circular-progress indeterminate></md-circular-progress>
        </div>

        <div class="state hidden" id="state-empty">
          <div class="state__icon"><md-icon id="empty-icon"></md-icon></div>
          <h2 class="md-typescale-headline-small" id="empty-title">暂无待验证的申请</h2>
          <p class="md-typescale-body-medium muted" id="empty-text">
            在群里点击「申请加入」后，我会私聊你一个验证入口。
          </p>
          <md-filled-tonal-button id="refresh">刷新状态</md-filled-tonal-button>
        </div>

        <div id="pending" class="hidden">
          <md-outlined-segmented-button-set id="method-switch" class="method-switch"></md-outlined-segmented-button-set>
          <div class="panel" id="method-panel"></div>
        </div>
      </section>

      <section id="view-audit" class="view hidden">
        <div class="card hidden" id="token-card">
          <md-outlined-text-field
            id="admin-token"
            label="ADMIN_TOKEN"
            type="password"
            supporting-text="浏览器模式需要部署时设置的 ADMIN_TOKEN"
          ></md-outlined-text-field>
          <div class="actions">
            <md-filled-button id="btn-token">保存并使用</md-filled-button>
          </div>
        </div>

        <div class="card">
          <md-outlined-text-field
            id="audit-chat"
            label="群组 ID"
            inputmode="numeric"
            supporting-text="在群里发 /id 可以看到"
          ></md-outlined-text-field>
          <div class="actions">
            <md-filled-button id="btn-audit-load">查询</md-filled-button>
            <md-outlined-button id="btn-audit-csv">导出 CSV</md-outlined-button>
          </div>
          <p class="md-typescale-body-small muted" id="audit-hint"></p>
        </div>

        <div id="audit-body"></div>
      </section>

      <footer class="foot md-typescale-label-medium">paffbot · Cloudflare Workers + D1</footer>
    </main>

    <md-dialog id="success-dialog" type="alert">
      <div slot="headline" class="md-typescale-headline-small">验证通过</div>
      <div slot="content" class="dialog-body">
        <div class="dialog-icon"><md-icon id="dialog-icon"></md-icon></div>
        <p class="md-typescale-body-medium" id="dialog-text"></p>
      </div>
      <div slot="actions">
        <md-filled-button id="dialog-close">完成</md-filled-button>
      </div>
    </md-dialog>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
