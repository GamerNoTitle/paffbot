<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5060B0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>芙 Bot · 入群验证</title>
    <link rel="stylesheet" href="./styles.css?v=18" />
    <script src="./vendor/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="page">
      <div class="page-top">
        <div class="page-top__left">
          <img class="logo" src="./icon-192.png" alt="芙 Bot" width="40" height="40" />
          <div class="segmented" role="tablist" aria-label="页面" id="nav">
          <button type="button" role="tab" data-view="verify" aria-selected="true">验证</button>
            <button type="button" role="tab" data-view="audit" aria-selected="false">审计</button>
          </div>
        </div>
        <md-icon-button id="theme-toggle" aria-label="切换明暗主题">
          <md-icon id="theme-icon"></md-icon>
        </md-icon-button>
      </div>

      <section id="view-verify" class="view">
        <div class="hero" id="hero">
          <div class="hero__copy">
            <p class="hero__eyebrow" id="hero-eyebrow">芙 Bot</p>
            <h1 class="hero__title" id="hero-title">正在检查…</h1>
            <p class="hero__sub" id="hero-sub">稍等，正在读取你的验证状态</p>
            <div class="hero__chips" id="hero-chips"></div>
            <div class="hero__progress hidden" id="hero-progress" role="progressbar" aria-label="剩余时间">
              <div class="wavy">
                <svg class="wavy__svg" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true">
                  <path class="wavy__track" id="wavy-track" d="" />
                </svg>
                <div class="wavy__mask" id="wavy-mask">
                  <svg class="wavy__svg" viewBox="0 0 100 10" preserveAspectRatio="none" aria-hidden="true">
                    <path class="wavy__bar" id="wavy-bar" d="" />
                  </svg>
                </div>
              </div>
            </div>
            <div class="hero__actions hidden" id="hero-actions">
              <md-filled-button id="hero-cta">打开 Miniapp 验证</md-filled-button>
              <md-filled-tonal-button id="hero-chat">通过聊天验证</md-filled-tonal-button>
            </div>
          </div>
          <div class="hero__art" id="hero-art" aria-hidden="true"></div>
        </div>

        <div class="state" id="state-loading">
          <md-circular-progress indeterminate></md-circular-progress>
        </div>

        <div class="state hidden" id="state-empty">
          <div class="state__icon"><md-icon id="empty-icon"></md-icon></div>
          <h2 class="md-typescale-headline-small" id="empty-title">暂无待验证的申请</h2>
          <p class="md-typescale-body-medium muted" id="empty-text">
            在群里点击「申请加入」后，我会私聊你一个验证入口。
          </p>
          <div class="actions">
            <md-filled-tonal-button id="refresh">刷新状态</md-filled-tonal-button>
            <md-outlined-button id="btn-standalone">单独校验 GitHub 账号</md-outlined-button>
          </div>
        </div>

        <div id="pending" class="hidden">
          <div class="panel" id="method-panel"></div>
        </div>
      </section>

      <section id="view-audit" class="view hidden">
        <header class="page-head">
          <h1 class="md-typescale-headline-large">审计</h1>
          <p class="md-typescale-body-medium muted">按群查看验证记录与操作日志</p>
        </header>

        <div class="card hidden" id="token-card">
          <md-outlined-text-field id="admin-token" label="ADMIN_TOKEN" type="password"></md-outlined-text-field>
          <div class="filter-actions">
            <md-filled-button id="btn-token">保存并使用</md-filled-button>
          </div>
        </div>

        <div class="card">
          <div class="filter-row">
            <md-outlined-text-field
              id="audit-chat"
              label="群组 ID"
              inputmode="numeric"
              supporting-text="在群里发 /id 可以看到"
            ></md-outlined-text-field>
            <div class="filter-actions">
              <md-filled-button id="btn-audit-load">查询</md-filled-button>
              <md-outlined-button id="btn-audit-csv">导出 CSV</md-outlined-button>
            </div>
          </div>
          <p class="md-typescale-body-small muted" id="audit-hint"></p>
        </div>

        <div id="audit-stats"></div>
        <div id="audit-body"></div>
      </section>

      <footer class="foot md-typescale-label-medium" id="foot"></footer>
    </div>

    <md-dialog id="success-dialog" type="alert">
      <div slot="headline" class="md-typescale-headline-small" id="dialog-title">验证通过</div>
      <div slot="content" class="dialog-body">
        <div class="dialog-icon" id="dialog-icon-wrap"><md-icon id="dialog-icon"></md-icon></div>
        <p class="md-typescale-body-medium" id="dialog-text"></p>
      </div>
      <div slot="actions">
        <md-filled-button id="dialog-close">完成</md-filled-button>
      </div>
    </md-dialog>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./app.js?v=18"></script>
  </body>
</html>
